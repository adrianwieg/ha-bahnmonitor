name: Validate Bahnmonitor
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest aiohttp
      - name: Check Python syntax
        run: python -m compileall -q custom_components/bahnmonitor tests
      - name: Check integration manifests
        run: |
          python -m json.tool custom_components/bahnmonitor/manifest.json >/dev/null
          python -m json.tool custom_components/bahnmonitor/strings.json >/dev/null
          python -m json.tool custom_components/bahnmonitor/translations/de.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Run unit tests
        run: python -m pytest -q tests
