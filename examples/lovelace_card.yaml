# Lovelace -> Dashboard bearbeiten -> Karte hinzufügen -> Manuell.
# Komplette YAML-Datei als eine Karte einfügen.
# Die drei entity_id-Werte ggf. an die von Home Assistant vergebenen IDs anpassen.
type: vertical-stack
cards:
  - type: markdown
    title: "🚆 Meine Zugfahrt"
    content: |
      {% set id = 'sensor.pendlerzug_naechste_fahrt' %}
      {% set trips = state_attr(id, 'journeys') or [] %}
      {% set status = states(id) %}
      {% set origin = state_attr(id, 'origin') or 'Startbahnhof' %}
      {% set destination = state_attr(id, 'destination') or 'Zielbahnhof' %}
      {% set departure = state_attr(id, 'display_departure') or '–' %}
      {% set planned = state_attr(id, 'display_planned') or '–' %}
      {% set delay = state_attr(id, 'display_delay') or 'Unbekannt' %}
      {% set track = state_attr(id, 'display_platform') or 'Gleis unbekannt' %}

      ### {{ origin }} → {{ destination }}

      {% if status == 'Verspätet' %}
      ## 🟠 {{ departure }} · {{ delay }}
      {% elif status == 'Pünktlich' %}
      ## 🟢 {{ departure }} · Pünktlich
      {% elif status == 'Fällt aus' %}
      ## 🔴 Fahrt fällt aus
      {% elif status == 'Planmäßig' %}
      ## 🔵 {{ departure }} · Planmäßig
      {% elif 'Zugprognose ab ' in status %}
      ## 🕒 {{ planned }} · {{ status }}
      {% elif status == 'Zuordnung unbestätigt' %}
      ## ⚪ {{ departure }} · Möglicher Zugtreffer
      {% else %}
      ## ⚪ {{ status }}
      {% endif %}

      {% if state_attr(id, 'timetable_confirmed') %}
      **Fahrplan:** {{ planned }} Uhr · **{{ track }}**
      {% else %}
      **Konfigurierte Abfahrt:** {{ planned }} Uhr · noch nicht durch den Fahrplandienst bestätigt
      {% endif %}

      {% if state_attr(id, 'display_note') %}
      *{{ state_attr(id, 'display_note') }}*
      {% endif %}
      {% if trips and (trips[0].get('turnaround') or {}).get('risk') %}
      ⚠️ **Mögliche Folgeverspätung durch die ankommende Vorleistung!** Die aktuell gemeldete eigene Abfahrtszeit berücksichtigt diese rechnerische Warnung möglicherweise noch nicht.
      {% endif %}
      {% set data_source = state_attr(id, 'source') or '' %}
      {% if 'GTFS' in data_source %}
      *Sollfahrplan: [GTFS Deutschland](https://gtfs.de/de/feeds/de_rv/) · DELFI e.V. · CC BY 4.0*
      {% endif %}

      {% if state_attr(id, 'platform_changed') %}
      ⚠️ Gleisänderung erkannt
      {% endif %}
      {% if trips and trips[0].get('stale') %}
      ⚠️ Angaben möglicherweise veraltet
      {% endif %}
      *Zuginformationen können sich kurzfristig ändern.*

  - type: markdown
    title: "🔄 Mögliche Vorleistung → Zugwende → Deine Fahrt"
    content: |
      {% set id = 'sensor.pendlerzug_naechste_fahrt' %}
      {% set trips = state_attr(id, 'journeys') or [] %}
      {% set trip = trips[0] if trips else {} %}
      {% set turn = trip.get('turnaround') or {} %}
      {% if not turn.get('incoming_planned') %}
      Noch keine passende Vorleistung gefunden oder geprüft.
      {% else %}
      **1. Ankommender RE 1 · {{ turn.get('incoming_route', 'Vorleistung zum Wendebahnhof') }}**

      {% if turn.get('incoming_departure_planned') %}
      - **Abfahrt {{ turn.get('incoming_origin_station', 'Ausgangsbahnhof') }}:** {{ as_datetime(turn.get('incoming_departure_planned')).strftime('%H:%M') }} Uhr geplant{% if turn.get('incoming_departure_predicted') %} → {{ as_datetime(turn.get('incoming_departure_predicted')).strftime('%H:%M') }} Uhr prognostiziert{% endif %}{% if turn.get('incoming_departure_delay_minutes') is number %} ({{ '%+d' | format(turn.get('incoming_departure_delay_minutes')) }} Min.){% endif %}
      {% else %}
      - Ausgangsabfahrt nicht eindeutig zugeordnet.
      {% endif %}
      - **Ankunft {{ turn.get('turnaround_station', 'Wendebahnhof') }}:** {{ as_datetime(turn.get('incoming_planned')).strftime('%H:%M') }} Uhr geplant{% if turn.get('incoming_predicted') %} → {{ as_datetime(turn.get('incoming_predicted')).strftime('%H:%M') }} Uhr prognostiziert{% endif %}{% if turn.get('incoming_delay_minutes') is number %} ({{ '%+d' | format(turn.get('incoming_delay_minutes')) }} Min.){% endif %}

      **2. Zugwende in {{ turn.get('turnaround_station', 'Wendebahnhof') }}**

      {% if turn.get('turnaround_buffer_minutes') is number %}
      {% if turn.get('risk') %}
      ⚠️ **Nur {{ turn.get('turnaround_buffer_minutes') }} Minuten rechnerische Wendezeit**, statt der angenommenen {{ turn.get('minimum_turnaround_minutes', '–') }} Minuten.
      {% else %}
      {{ turn.get('turnaround_buffer_minutes') }} Minuten rechnerische Wendezeit.
      {% endif %}
      {% else %}
      Wendezeit derzeit nicht berechenbar.
      {% endif %}

      **3. Deine Fahrt · {{ turn.get('outgoing_route', 'Abfahrt am Wendebahnhof') }}**

      - **Sollabfahrt:** {{ (trip.get('scheduled_departure') or '')[11:16] }} Uhr.
      - **Gemeldete Abfahrt:** {{ (trip.get('predicted_departure') or '')[11:16] or 'noch unbekannt' }} Uhr.
      {% if turn.get('risk') and turn.get('earliest_plausible_outgoing') %}
      - **Rechnerisch frühestens:** {{ as_datetime(turn.get('earliest_plausible_outgoing')).strftime('%H:%M') }} Uhr – *nur falls tatsächlich derselbe Zug eingesetzt und der Mindest-Wendepuffer benötigt wird*.
      {% endif %}

      *Zuordnung: {{ 'Zwei Bahnhofsmeldungen zeitlich abgeglichen' if turn.get('incoming_departure_match') == 'plausible' else 'Ankommender Zug derselben Linie gefunden' }}. Die eingesetzte Fahrzeuggarnitur ist nicht bestätigt.*
      {% endif %}

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.pendlerzug_streckenlage
        name: Streckenlage
        vertical: true
      - type: tile
        entity: sensor.pendlerzug_fahrplandienst
        name: Datenquelle
        vertical: true
      - type: tile
        entity: binary_sensor.pendlerzug_zugausfall
        name: Ausfall
        vertical: true

  - type: markdown
    title: "🚦 Streckenlage heute · beide Richtungen"
    content: |
      {% set id = 'sensor.pendlerzug_streckenlage' %}
      {% set status = states(id) %}
      {% set same = state_attr(id, 'same_direction') or {} %}
      {% set rev = state_attr(id, 'reverse_direction') or {} %}
      {% set summary = state_attr(id, 'summary') or 'Noch keine Daten vorhanden.' %}
      {% set source = state_attr(id, 'source_status') or 'not_checked' %}
      {% if status == 'Unauffällig' %}
      ### 🟢 {{ status }}
      {% elif status == 'Auffällig' %}
      ### 🟠 {{ status }}
      {% elif status == 'Stark gestört' %}
      ### 🔴 {{ status }}
      {% elif status.startswith('Startet um ') %}
      ### 🕒 {{ status }}
      {% else %}
      ### ⚪ {{ status }}
      {% endif %}

      {{ summary }}

      **Einordnung der Meldungen:** {{ state_attr(id, 'sample_count') or 0 }} mit vergangener Soll- und Prognosezeit · {{ state_attr(id, 'awaiting_count') or 0 }} trotz verstrichener Sollzeit noch erwartet · {{ state_attr(id, 'upcoming_scheduled_count') or 0 }} bevorstehende Sollabfahrten.

      **Warum diese Einstufung?**

      {{ state_attr(id, 'reason') or 'Noch keine erklärbaren Zugmeldungen verfügbar.' }}

      *Die Strecke wird ganztägig überwacht. Die Werte sind kein Beweis für eine spätere Verspätung.*

      **{{ same.get('label', 'Konfigurierte Fahrtrichtung') }}:** {{ same.get('count', 0) }} frühere Soll-/Prognosezeiten, {{ same.get('delayed_count', 0) }} mit Verspätung

      **{{ rev.get('label', 'Entgegengesetzte Fahrtrichtung') }}:** {{ rev.get('count', 0) }} frühere Soll-/Prognosezeiten, {{ rev.get('delayed_count', 0) }} mit Verspätung

      {% if same.get('trains') %}
      **{{ same.get('label', 'Konfigurierte Fahrtrichtung') }} · Soll- und Prognosezeit vergangen**

      | Zug | Abfahrt | Verspätung |
      |:---|:---|---:|
      {% for t in same.get('trains', []) %}
      | {{ t.get('line', '?') }} | {{ as_datetime(t.scheduled_departure).strftime('%H:%M') }} | {{ 'Ausfall' if t.cancelled else ('+' ~ t.delay_minutes ~ ' Min' if t.delay_minutes is number and t.delay_minutes > 0 else (t.delay_minutes ~ ' Min' if t.delay_minutes is number else 'unbekannt')) }} |
      {% endfor %}
      {% endif %}

      {% if rev.get('trains') %}
      **{{ rev.get('label', 'Entgegengesetzte Fahrtrichtung') }} · Soll- und Prognosezeit vergangen**

      | Zug | Abfahrt | Verspätung |
      |:---|:---|---:|
      {% for t in rev.get('trains', []) %}
      | {{ t.get('line', '?') }} | {{ as_datetime(t.scheduled_departure).strftime('%H:%M') }} | {{ 'Ausfall' if t.cancelled else ('+' ~ t.delay_minutes ~ ' Min' if t.delay_minutes is number and t.delay_minutes > 0 else (t.delay_minutes ~ ' Min' if t.delay_minutes is number else 'unbekannt')) }} |
      {% endfor %}
      {% endif %}

      {% if same.get('current_departures') or rev.get('current_departures') %}
      **Noch erwartete und bevorstehende Abfahrten**

      | Richtung | Linie | Soll | Meldung |
      |:---|:---|:---|---:|
      {% for t in same.get('current_departures', []) %}
      | {{ same.get('label', 'Richtung 1') }} | {{ t.line }} | {{ as_datetime(t.scheduled_departure).strftime('%H:%M') }} | {{ 'Ausfall' if t.cancelled else ('+' ~ t.delay_minutes ~ ' Min' if t.delay_minutes is number and t.delay_minutes > 0 else (t.delay_minutes ~ ' Min' if t.delay_minutes is number else 'Unbekannt')) }} |
      {% endfor %}
      {% for t in rev.get('current_departures', []) %}
      | {{ rev.get('label', 'Richtung 2') }} | {{ t.line }} | {{ as_datetime(t.scheduled_departure).strftime('%H:%M') }} | {{ 'Ausfall' if t.cancelled else ('+' ~ t.delay_minutes ~ ' Min' if t.delay_minutes is number and t.delay_minutes > 0 else (t.delay_minutes ~ ' Min' if t.delay_minutes is number else 'Unbekannt')) }} |
      {% endfor %}
      {% endif %}

      {% if source != 'online' %}
      *Datenabdeckung: {{ source }} – einzelne Abfahrten können fehlen.*
      {% endif %}
      *Die Streckenlage ist ein Indikator, keine bestätigte Folgeverspätung oder Fahrzeugdurchbindung.*

  - type: entities
    title: "Weitere Informationen"
    entities:
      - entity: binary_sensor.pendlerzug_mogliche_folgeverspatung
        name: Mögliche Folgeverspätung
      - entity: sensor.pendlerzug_naechste_fahrt
        name: Abfahrtsstatus

  - type: markdown
    title: "🗓️ Nächste Fahrtage · Fahrplanabgleich"
    content: |
      {% set trips = state_attr('sensor.pendlerzug_naechste_fahrt', 'journeys') or [] %}
      {% if not trips %}
      Noch keine Fahrt konfiguriert oder Daten werden geladen.
      {% else %}
      | Datum / Sollzeit | Ergebnis |
      |:--|:--|
      {% for trip in trips %}
      | {{ (trip.get('scheduled_departure') or '')[0:16].replace('T', ' ') }} | {% if trip.get('status') == 'scheduled' and 'GTFS' in (trip.get('source') or '') %}🟦 Nur Sollfahrplan{% elif trip.get('status') == 'cancelled' and trip.get('source') %}🔴 Ausfall gemeldet{% elif trip.get('status') == 'delayed' %}🟠 Verspätungsprognose{% elif trip.get('status') == 'on_time' %}🟢 Pünktlich gemeldet{% else %}⚪ Nicht bestätigt{% endif %} |
      {% endfor %}

      **Fehlende GTFS-Treffer**

      {% for trip in trips %}
      {% if trip.get('gtfs_match_reason') %}
      - **{{ trip.get('date') }}:** {{ trip.get('message') or 'Keine passende Sollfahrt gefunden.' }}
      {% endif %}
      {% endfor %}

      *Ein fehlender GTFS-Treffer ist kein bestätigter Zugausfall.*
      {% endif %}
